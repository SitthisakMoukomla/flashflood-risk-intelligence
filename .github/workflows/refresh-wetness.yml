name: Refresh wetness data

on:
  schedule:
    # Run at 01:00 UTC daily = 08:00 Asia/Bangkok. Open-Meteo has the previous
    # day's CHIRPS-style accumulation by then.
    - cron: "0 1 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.x"

      - name: Install pipeline deps
        working-directory: pipeline
        run: uv sync --frozen

      - name: Refresh per-tambon wetness (663 points)
        working-directory: pipeline
        run: uv run python scripts/06_wetness.py --workers 4

      - name: Refresh gridded wetness + precip-now
        working-directory: pipeline
        run: uv run python scripts/06_wetness_grid.py

      - name: Stage updated artefacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/wetness_7d.json public/data/wetness_grid.json
          if git diff --cached --quiet; then
            echo "no changes — skipping commit"
            exit 0
          fi
          git commit -m "chore(data): daily wetness refresh

          rain_7d_mm + precip_now_mm_per_hr re-fetched from Open-Meteo
          for the 9 northern provinces. Generated by GitHub Actions cron.
          "
          git push
