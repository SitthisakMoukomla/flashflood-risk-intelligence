name: Publish building footprints to R2

# Copies the buildings.pmtiles archive from a GitHub release into the R2
# bucket the app reads. The archive is built locally (script 17, ~45 min
# on a laptop, 1.9 GB) and attached to a release because that is the one
# upload path that needs no R2 key on the laptop — this job holds the key
# as a repo secret, the same way the SAR job does.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag carrying the files"
        required: true
        default: "buildings-v3-20260907"
      files:
        description: "Space-separated asset names to copy to R2"
        required: true
        default: "buildings.pmtiles"

concurrency:
  group: publish-buildings
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout (just the uploader)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pipeline/scripts/r2_upload.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet click boto3

      - name: Fetch the files from the release
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: ${{ github.event.inputs.files }}
        run: |
          for f in $FILES; do
            gh release download "${{ github.event.inputs.tag }}" \
              --repo "${{ github.repository }}" --pattern "$f" --dir pipeline/data/output
            ls -l "pipeline/data/output/$f"
            # PMTiles v3 magic — refuse a .pmtiles that is not an archive.
            case "$f" in *.pmtiles) [ "$(head -c 7 "pipeline/data/output/$f")" = "PMTiles" ] ;; esac
          done

      - name: Upload to R2
        working-directory: pipeline
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          FILES: ${{ github.event.inputs.files }}
        run: for f in $FILES; do python scripts/r2_upload.py "data/output/$f"; done

      - name: Verify the public URL serves ranges
        env:
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          FILES: ${{ github.event.inputs.files }}
        run: |
          for f in $FILES; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -r 0-6 "$R2_PUBLIC_BASE/$f")
            echo "$f range request → $code"
            [ "$code" = "206" ]
          done
