name: Observed flood extent (Sentinel-1)

# Pulls Copernicus EMS Global Flood Monitoring tiles (Sentinel-1 change
# detection, run operationally by CEMS) from EODC's open STAC API, clips
# them to Thailand and publishes a raster tile pyramid (PMTiles) the
# webapp overlays as its own layer, plus the same extent as polygons for
# offline analysis.
#
# Window: 7 days. One Sentinel-1 pass only covers a strip, so a short
# window leaves most of the country unobserved; a week of passes gives
# full national coverage, and the compositing step keeps the most recent
# observation wherever passes overlap.
#
# Cadence: every 12 h. A full week is ~210 tiles and takes ~20 minutes,
# so twice a day keeps the picture fresh without burning Actions minutes.
on:
  schedule:
    - cron: "20 */12 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Look-back window in hours"
        default: "168"

concurrency:
  group: sar-flood
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout (sparse — the repo carries ~300 MB of building data)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pipeline/scripts/14_sar_flood.py
            pipeline/data/aoi/gadm41_THA_3.json.zip
            public/data/sar_flood.pmtiles
            public/data/sar_flood.geojson
            public/data/sar_flood_meta.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet click numpy "rasterio>=1.4" "shapely>=2.0" certifi pillow pmtiles

      - name: Fetch GFM tiles and build the flood tile pyramid
        working-directory: pipeline
        env:
          # rasterio reads the COGs over HTTP; keep GDAL from listing dirs.
          GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
          CPL_VSIL_CURL_ALLOWED_EXTENSIONS: ".tif"
        run: python scripts/14_sar_flood.py --hours ${{ github.event.inputs.hours || '168' }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/sar_flood.pmtiles public/data/sar_flood.geojson public/data/sar_flood_meta.json
          if git diff --cached --quiet; then
            echo "no change in observed flood extent — nothing to commit"
            exit 0
          fi
          git commit -m "chore(data): observed flood extent from Sentinel-1 (GFM)"
          # The Mae Sai logger commits every 30 min — rebase before pushing.
          git pull --rebase --autostash origin ${GITHUB_REF_NAME}
          git push
