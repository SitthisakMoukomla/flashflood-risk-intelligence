name: Log Mae Sai water levels

# Builds the history HII's public API doesn't expose (its /waterlevel_graph
# endpoint 500s and /waterlevel_load ignores station_id), so we can later
# calibrate an empirical travel time from the upstream Sai-river gauges to
# the Mae Sai Friendship Bridge.
#
# Cadence note: this repo is private, so GitHub Actions bills against the
# 2,000 free minutes/month. Each run is billed as 1 minute, so every 30
# minutes = 48/day ≈ 1,440 min/month — inside the free tier with headroom.
# Going to 10-15 minute sampling (matching HII's telemetry push rate) needs
# either a public repo or a paid plan.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: maesai-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (sparse — the repo carries ~300 MB of building data)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pipeline/scripts/12_maesai_log.py
            public/data/maesai_log.jsonl
            pipeline/scripts/19_krathumlom_log.py
            pipeline/scripts/r2_upload.py
            public/data/krathumlom_log.jsonl
          sparse-checkout-cone-mode: false

      # Script is stdlib-only on purpose: no uv sync, no pip install.
      - name: Poll HII and append
        run: python3 pipeline/scripts/12_maesai_log.py

      # Krathum Lom municipal dashboard trend lines. Same run on purpose:
      # a second schedule would not fit the free Actions minutes.
      - name: Poll gauges around Krathum Lom
        run: python3 pipeline/scripts/19_krathumlom_log.py

      # The site only redeploys by hand, so a log committed here would sit
      # stale in production. The dashboard reads this copy on R2 instead.
      - name: Publish Krathum Lom log to R2
        if: ${{ hashFiles('public/data/krathumlom_log.jsonl') != '' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
        run: |
          pip install --quiet --disable-pip-version-check boto3 click
          python3 pipeline/scripts/r2_upload.py public/data/krathumlom_log.jsonl --cache-seconds 60

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/maesai_log.jsonl public/data/krathumlom_log.jsonl
          if git diff --cached --quiet; then
            echo "no new telemetry — nothing to commit"
            exit 0
          fi
          git commit -m "chore(data): Mae Sai + Krathum Lom gauge poll"
          # Another run may have landed while this one was working.
          git pull --rebase --autostash origin ${GITHUB_REF_NAME}
          git push
