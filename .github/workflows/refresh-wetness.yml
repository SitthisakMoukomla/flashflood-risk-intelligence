name: Refresh wetness data

on:
  schedule:
    # Run at 01:00 UTC daily = 08:00 Asia/Bangkok. Open-Meteo has the previous
    # day's CHIRPS-style accumulation by then.
    - cron: "0 1 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.x"

      - name: Install pipeline deps
        working-directory: pipeline
        run: uv sync --frozen

      # History: this job used to run 06_wetness.py, which needs a gitignored
      # build artefact and so failed every run from May onwards, silently
      # freezing the map's rain data for three months.
      #
      # The 7-day accumulation now comes from CHIRPS — one global GeoTIFF per
      # day, no account, no quota — instead of Open-Meteo, whose free tier is
      # metered per location-hour and returns 429 partway through a nationwide
      # grid. CHIRPS preliminary files lag 2-4 days, which is fine for the
      # soil-moisture term; the live trigger comes from HII stations and radar
      # in the browser, and those are current.
      - name: Refresh 7-day rainfall (CHIRPS, nationwide)
        working-directory: pipeline
        run: uv run python scripts/17_rain_chirps.py

      - name: Stage updated artefacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/wetness_grid.json
          if git diff --cached --quiet; then
            echo "no changes — skipping commit"
            exit 0
          fi
          git commit -m "chore(data): daily wetness refresh

          rain_7d_mm + precip_now_mm_per_hr re-fetched from Open-Meteo.
          Generated by GitHub Actions cron.
          "
          git push
